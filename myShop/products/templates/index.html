<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .product-card {
           transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 1);
        }
        .product img {
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4 fw-bold text-primary">Product Catalog</h1>
        <div class="row g-4">
            {% for product in products %}
            <div class="col-md-4">
                <div class="card product-card h-100">
                    <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.prodname }}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ product.prodname }}</h5>
                        <p class="card-text text-muted mb-2">{{ product.description|truncatechars:100 }}</p>
                        <p class="card-text fw-bold">Php {{ product.price }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
