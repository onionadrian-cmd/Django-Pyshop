
{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- ========================= SECTION MAIN ========================= -->
<section class="section-intro padding-y-sm">
<div class="container">

<div class="intro-banner-wrap">
	{% if banner %}
		{% if banner.link %}
			<a href="{{ banner.link }}">
				<img src="{{ banner.image.url }}" class="img-fluid rounded" alt="{{ banner.title }}">
			</a>
		{% else %}
			<img src="{{ banner.image.url }}" class="img-fluid rounded" alt="{{ banner.title }}">
		{% endif %}
	{% else %}
		<img src="{% static 'images/banners/1.jpg' %}" class="img-fluid rounded">
	{% endif %}
</div>

</div> <!-- container //  -->
</section>
<!-- ========================= SECTION MAIN END// ========================= -->

<!-- ========================= SECTION  ========================= -->
<section class="section-name padding-y-sm">
<div class="container">

<header class="section-heading">
	<a href="./store.html" class="btn btn-outline-primary float-right">See all</a>
	<h3 class="section-title">Popular products</h3>
</header><!-- sect-heading -->


<div class="row">
	{% for product in products %}
	<div class="col-md-3">
		<div class="card card-product-grid">
			
			<a href="{{ product.get_url }}" class="img-wrap">
				<img src="{% if product.image_url %}{{ product.image_url }}{% elif product.images %}{{ product.images.url }}{% endif %}" alt="{{ product.product_name }}">
			</a>
			<figcaption class="info-wrap">
				<a href="{{ product.get_url }}" class="title">{{ product.product_name }}</a>
				<div class="price mt-1">₱{{ product.product_price|floatformat:2 }}</div> <!-- price-wrap.// -->
			</figcaption>
		</div>
	</div> <!-- col.// -->
	{% endfor %}
</div> <!-- row.// -->

</div><!-- container // -->
</section>
<!-- ========================= SECTION  END// ========================= -->



</body>
</html>

{% endblock %}
